name: Validate workshop

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# We ignore concurrency for main pushes to avoid the finickiness of canceling in-progress runs on main, while still executing quickly.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.run_id }}
  cancel-in-progress: true

jobs:
  run-test:
    name: Run tests in workshop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: canonical/launch-workshop@v1
        with:
          cache: |
            go:mod-cache
      
      - name: Run tests in workshop
        run: |
          workshop run dev test

  run-build-deb:
    name: Run build-deb in workshop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: canonical/launch-workshop@v1
        with:
          cache: |
            go:mod-cache
      
      - name: Run build-deb in workshop
        run: |
          workshop run dev build-deb
